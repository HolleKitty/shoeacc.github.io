<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
            background: #f5f3f0;
            color: #4a4540;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }

        .container { max-width: 480px; }

        h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: #2a2520;
            margin-bottom: 1.5rem;
        }

        .divider {
            width: 32px;
            height: 1px;
            background: #c4bfb8;
            margin: 0 auto 2rem;
        }

        .message {
            font-size: 1.05rem;
            font-weight: 300;
            line-height: 2;
            color: #8a8278;
        }

        .footer {
            position: fixed;
            bottom: 2rem;
        }

        .footer a {
            font-size: 0.78rem;
            color: #b0a89e;
            text-decoration: none;
            letter-spacing: 0.03em;
        }

        .footer a:hover { color: #6a6258; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ site.title }}</h1>
        <div class="divider"></div>
        <div class="message">{{ site.description }}</div>
    </div>

    <div class="footer">
        <a href="{{ site.footer_link }}" target="_blank" rel="noopener">{{ site.footer_text }}</a>
    </div>
</body>
</html>
